seed: 1234
device: auto
output_root: outputs
data_path: data/usol.mat

domain:
  x_min: -1.0
  x_max: 1.0
  t_min: 0.0
  t_max: 1.0

pde:
  diffusion: 1.0e-4

model:
  layers: [2, 64, 64, 64, 64, 1]
  activation: tanh

train:
  epochs: 1500
  adam_lr: 1.0e-3
  use_lbfgs: false
  lbfgs_steps: 200
  n_f: 2000
  n_ic: 256
  n_bc: 256
  n_eval_pde: 5000
  log_every: 100

adaptive_points:
  start_epoch: 700
  interval: 400
  rounds: 2
  n_candidates: 12000
  n_add: 400

adaptive_weights:
  ema: 0.9
  min_value: 0.1
  max_value: 10.0
  update_every: 10

plot:
  slice_times: [0.0, 0.25, 0.5, 0.75, 1.0]

experiments:
  uniform_equal:
    sampling: uniform
    weight_mode: equal_weights
    adaptive_points: false

  random_equal:
    sampling: random
    weight_mode: equal_weights
    adaptive_points: false

  random_adaptive_points:
    sampling: random
    weight_mode: equal_weights
    adaptive_points: true

  random_adaptive_weights:
    sampling: random
    weight_mode: adaptive_weights
    adaptive_points: false

run_order:
  - uniform_equal
  - random_equal
  - random_adaptive_points
  - random_adaptive_weights
